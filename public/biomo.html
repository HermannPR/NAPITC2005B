    <!-- Scripts -->
    <script src="auth-utils.js"></script>

      <script>
      // Inicializar la aplicación cuando el DOM esté listo
      document.addEventListener('DOMContentLoaded', function() {
        // Inicializar página con sidebar
        if (!initializePage({ showSidebar: true })) {
          return;
        }
        
        // Funcionalidad específica del chat
        initializeBiomoChat();
      });
      
      // Función para inicializar el chat del biomo con API de AI
      function initializeBiomoChat() {
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const chatMessages = document.getElementById('chatMessages');
        
        // Mostrar mensaje de bienvenida inicial
        const welcomeMessage = document.createElement('div');
        welcomeMessage.className = 'message bot-message';
        welcomeMessage.innerHTML = `<p>👋 ¡Hola! Soy tu asistente especializado en biomonitoreo ambiental. Estoy aquí para ayudarte con cualquier consulta sobre tu Biomo, análisis de datos ecológicos, o gestión de proyectos ambientales. ¿En qué puedo asistirte hoy?</p>`;
        chatMessages.appendChild(welcomeMessage);        // Configuración para el chat AI
        // Ahora usamos la API del servidor que maneja las credenciales de forma segura
        const CHAT_CONFIG = {
          API_ENDPOINT: '/Consultas/api/chat',
          CONTEXT: 'biomo'
        };
        
        async function sendMessage() {
          const message = chatInput.value.trim();
          if (!message) return;
          
          // Agregar mensaje del usuario
          const userMessage = document.createElement('div');
          userMessage.className = 'message user-message';
          userMessage.innerHTML = `<p>${message}</p>`;
          chatMessages.appendChild(userMessage);
          
          // Limpiar input y hacer scroll
          chatInput.value = '';
          chatMessages.scrollTop = chatMessages.scrollHeight;
          
          // Mostrar indicador de escritura
          const typingIndicator = document.createElement('div');
          typingIndicator.className = 'message bot-message typing-indicator';
          typingIndicator.innerHTML = `<p>🤖 Analizando tu consulta sobre el Biomo...</p>`;
          chatMessages.appendChild(typingIndicator);
          chatMessages.scrollTop = chatMessages.scrollHeight;
            try {
            // Llamar a la nueva API del servidor
            const token = localStorage.getItem('token');
            const response = await fetch(CHAT_CONFIG.API_ENDPOINT, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify({
                message: message,
                context: CHAT_CONFIG.CONTEXT
              })
            });
            
            // Remover indicador de escritura
            chatMessages.removeChild(typingIndicator);
            
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const data = await response.json();
            
            if (data.success) {
              // Respuesta exitosa de la AI
              const aiResponse = data.response;
              
              // Agregar respuesta de la AI
              const botMessage = document.createElement('div');
              botMessage.className = 'message bot-message';
              botMessage.innerHTML = `<p>${aiResponse}</p>`;
              chatMessages.appendChild(botMessage);
            } else {
              // Usar respuesta de fallback
              const fallbackMessage = document.createElement('div');
              fallbackMessage.className = 'message bot-message';
              fallbackMessage.innerHTML = `<p>${data.fallbackResponse}</p>`;
              chatMessages.appendChild(fallbackMessage);
            }          } catch (error) {
            console.error('Error llamando a la API de AI:', error);
            
            // Información adicional de debugging
            console.log('🔍 DEBUG - Error details:');
            console.log('📱 URL:', CHAT_CONFIG.API_ENDPOINT);
            console.log('🔑 Token exists:', !!localStorage.getItem('token'));
            console.log('📦 Message sent:', message);
            console.log('🌐 Full URL attempted:', window.location.origin + CHAT_CONFIG.API_ENDPOINT);
            
            // Remover indicador de escritura si aún existe
            if (chatMessages.contains(typingIndicator)) {
              chatMessages.removeChild(typingIndicator);
            }
            
            // Mostrar mensaje de error contextual con información de debugging
            const errorMessage = document.createElement('div');
            errorMessage.className = 'message bot-message error-message';
            
            // Crear respuesta de fallback más inteligente
            let fallbackText = '';
            const messageLower = message.toLowerCase();
            
            if (messageLower.includes('datos') || messageLower.includes('registros')) {
              fallbackText = '📊 Para consultar tus datos de biomonitoreo, accede al panel de administración donde encontrarás todos tus registros organizados.';
            } else if (messageLower.includes('subir') || messageLower.includes('cargar')) {
              fallbackText = '📤 Para subir nuevos datos, usa el botón "Subir Datos" en la parte superior de esta página.';
            } else if (messageLower.includes('reporte') || messageLower.includes('pdf')) {
              fallbackText = '📋 Para generar reportes, utiliza el botón "Generar PDF" que crea análisis detallados de tus datos.';
            } else if (messageLower.includes('especies') || messageLower.includes('biodiversidad')) {
              fallbackText = '🌱 Para información sobre especies, consulta nuestra base de datos de biodiversidad integrada.';
            } else {
              fallbackText = '🔬 Como especialista en biomonitoreo, puedo ayudarte con análisis de datos, gestión de registros y generación de reportes ambientales.';
            }            
            errorMessage.innerHTML = `
              <p><strong>🤖 Asistente Biomo:</strong> Lo siento, hay un problema temporal con el servicio de AI.</p>
              <p><strong>🔍 Error:</strong> ${error.message}</p>
              <p>${fallbackText}</p>
              <p><em>¿Necesitas ayuda con algún tema específico del biomonitoreo?</em></p>
              <p><small>🛠️ Debug info: URL=${CHAT_CONFIG.API_ENDPOINT}, Token=${!!localStorage.getItem('token')}</small></p>
            `;
            chatMessages.appendChild(errorMessage);
          }
          
          // Scroll al final
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Event listeners para el chat
        if (sendButton) {
          sendButton.addEventListener('click', sendMessage);
        }
        
        if (chatInput) {
          chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
              sendMessage();
            }
          });
        }
        
        // Mensaje de bienvenida mejorado
        setTimeout(() => {
          const welcomeMessage = document.createElement('div');
          welcomeMessage.className = 'message bot-message';
          welcomeMessage.innerHTML = `
            <p>¡Hola! Soy Mawi AI, tu asistente especializado en biomonitoreo. Estoy aquí para ayudarte con:</p>
            <ul>
              <li>🌿 Análisis de datos de tu Biomo</li>
              <li>📊 Interpretación de métricas ambientales</li>
              <li>📋 Gestión de registros de biodiversidad</li>
              <li>🔍 Recomendaciones para monitoreo</li>
              <li>📄 Generación de reportes</li>
            </ul>
            <p>¿En qué puedo ayudarte hoy?</p>
          `;
          chatMessages.appendChild(welcomeMessage);
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 1000);
      }
    </script>

        font-size: 14px;

        border-radius: 8px;

        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      
      .send-button:hover {
        background-color: #278c3b;
      }
      
      /* Estilos adicionales para el chat con AI */
      .typing-indicator {
        animation: pulse 1.5s infinite;
      }
      
      @keyframes pulse {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
      
      .error-message {
        border-left: 4px solid #ff6b6b;
        background-color: #4a2c2c !important;
      }
      
      .message ul {
        margin: 8px 0;
        padding-left: 20px;
      }
      
      .message li {
        margin: 4px 0;
        color: #e0e0e0;
      }
      
      .chat-input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      
      .send-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        background-color: #666;
      }
      
      .welcome-message {
        border-left: 4px solid #30a046;
        background-color: #2d4a2d !important;
      }
      
      /* Media queries para responsividad */
      @media (max-width: 768px) {
        .biomo-actions {
          flex-direction: column;
        }
        
        .action-button {
          justify-content: center;
        }
        
        .chat-container {
          height: calc(100vh - 320px);

        .message {

        }      }
