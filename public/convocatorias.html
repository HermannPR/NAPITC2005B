<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente de Nuevas Convocatorias - Mawi</title>
    <meta name="description" content="Asistente de Nuevas Convocatorias" />    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/sidebar-styles.css" />  </head>
  <body class="with-sidebar-toggle">
    <div class="mawi-app-container">
      <header class="mawi-header">
        <div class="sidebar-toggle" id="sidebarToggle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M4 6H20M4 12H20M4 18H20" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        
        <div class="logo">
          <img src="eye-icon.svg" alt="Mawi" class="eye-icon" />
          <h2>Mawi</h2>
        </div>
        
        <div class="user-menu">
          <span id="userName">EcoRanger</span>
          <div class="avatar-circle">
            <img src="avatar-placeholder.svg" alt="Usuario" />
          </div>
        </div>
      </header>      <!-- Overlay para móvil -->
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <div class="app-content">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-content">
            <nav class="sidebar-nav">
              <a href="dashboard.html" class="sidebar-item">Inicio</a>
              <a href="biomo.html" class="sidebar-item">Asistente de Mi Biomo</a>
              <a href="explorador.html" class="sidebar-item">Asistente Explorador de Anteproyectos</a>
              <a href="convocatorias.html" class="sidebar-item active">Asistente de Convocatorias</a>
            </nav>
            <div class="sidebar-footer">
              <a href="#" class="support-link">
                <img src="support-icon.svg" alt="Soporte" />
                Contacta con el soporte
              </a>
            </div>
          </div>
        </aside>

        <!-- Main content -->
        <main class="main-content">
          <div class="back-button">
            <a href="dashboard.html">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>
          
          <div class="page-header">
            <h1>Asistente de Nuevas Convocatorias</h1>
          </div>

          <div class="convocatorias-form">
            <form id="convocatoriaForm">
              <div class="form-row">
                <div class="form-group">
                  <label for="nombre-anteproyecto">Nombre del anteproyecto</label>
                  <input 
                    type="text" 
                    id="nombre-anteproyecto"
                    class="form-input" 
                    placeholder="Escribe..."
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="region">Región</label>
                  <input 
                    type="text" 
                    id="region"
                    class="form-input" 
                    placeholder="Escribe..."
                    required
                  />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="fecha-cierre">Fecha de cierre</label>
                  <input 
                    type="date" 
                    id="fecha-cierre"
                    class="form-input" 
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="organizacion">Organización</label>
                  <input 
                    type="text" 
                    id="organizacion"
                    class="form-input" 
                    placeholder="Escribe..."
                    required
                  />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="sitio-web">Sitio web</label>
                  <input 
                    type="url" 
                    id="sitio-web"
                    class="form-input" 
                    placeholder="Escribe..."
                  />
                </div>

                <div class="form-group">
                  <label for="pais">País</label>
                  <input 
                    type="text" 
                    id="pais"
                    class="form-input" 
                    placeholder="Escribe..."
                    required
                  />
                </div>
              </div>
              
              <div class="form-group full-width">
                <label for="descripcion">Descripción</label>
                <textarea
                  id="descripcion"
                  class="form-input" 
                  placeholder="Escribe..."
                  rows="4"
                  required
                ></textarea>
              </div>

              <div class="action-buttons">
                <button type="button" class="action-button upload-btn">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M12 5V19M5 12H19" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  Subir Datos
                </button>
                
                <button type="submit" class="action-button primary">
                  <span>Guardar</span>
                </button>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>

    <!-- Scripts -->
    <script src="auth-utils.js"></script>
    
    <script>      // Inicializar la aplicación cuando el DOM esté listo
      document.addEventListener('DOMContentLoaded', function() {
        // Inicializar página con sidebar
        if (!initializePage({ showSidebar: true })) {
          return;
        }
        
        // Funcionalidad específica de convocatorias
        initializeConvocatorias();
      });
      
      // Función para inicializar funcionalidad específica
      function initializeConvocatorias() {
        const form = document.getElementById('convocatoriaForm');
        const uploadBtn = document.querySelector('.upload-btn');
        
        // Manejar envío del formulario
        if (form) {
          form.addEventListener('submit', function(e) {
            e.preventDefault();
            handleConvocatoriaSubmit();
          });
        }
        
        // Manejar botón de subir datos
        if (uploadBtn) {
          uploadBtn.addEventListener('click', function() {
            handleDataUpload();
          });
        }
        
        // Auto-save draft cada 30 segundos
        setInterval(saveDraft, 30000);
        
        // Cargar draft al iniciar
        loadDraft();
      }
      
      // Función para manejar el envío del formulario
      function handleConvocatoriaSubmit() {
        const formData = {
          nombreAnteproyecto: document.getElementById('nombre-anteproyecto').value,
          region: document.getElementById('region').value,
          fechaCierre: document.getElementById('fecha-cierre').value,
          organizacion: document.getElementById('organizacion').value,
          sitioWeb: document.getElementById('sitio-web').value,
          pais: document.getElementById('pais').value,
          descripcion: document.getElementById('descripcion').value
        };
        
        // Validar datos
        if (!validateFormData(formData)) {
          alert('Por favor, completa todos los campos requeridos.');
          return;
        }
        
        // Simular envío (aquí iría la llamada a la API)
        console.log('Datos de convocatoria:', formData);
        alert('Convocatoria guardada exitosamente!');
        
        // Limpiar formulario
        document.getElementById('convocatoriaForm').reset();
        
        // Limpiar draft guardado
        localStorage.removeItem('convocatoria_draft');
      }
      
      // Función para validar datos del formulario
      function validateFormData(data) {
        return data.nombreAnteproyecto && 
               data.region && 
               data.fechaCierre && 
               data.organizacion && 
               data.pais && 
               data.descripcion;
      }
      
      // Función para manejar subida de datos
      function handleDataUpload() {
        // Crear input file dinámico
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.pdf,.doc,.docx,.txt';
        fileInput.multiple = true;
        
        fileInput.addEventListener('change', function(e) {
          const files = e.target.files;
          if (files.length > 0) {
            console.log('Archivos seleccionados:', files);
            alert(`${files.length} archivo(s) seleccionado(s). Funcionalidad de subida pendiente de implementación.`);
          }
        });
        
        fileInput.click();
      }
      
      // Función para guardar borrador
      function saveDraft() {
        const formData = {
          nombreAnteproyecto: document.getElementById('nombre-anteproyecto').value,
          region: document.getElementById('region').value,
          fechaCierre: document.getElementById('fecha-cierre').value,
          organizacion: document.getElementById('organizacion').value,
          sitioWeb: document.getElementById('sitio-web').value,
          pais: document.getElementById('pais').value,
          descripcion: document.getElementById('descripcion').value,
          timestamp: new Date().toISOString()
        };
        
        // Solo guardar si hay algún dato
        const hasData = Object.values(formData).some(value => value && value.trim());
        if (hasData) {
          localStorage.setItem('convocatoria_draft', JSON.stringify(formData));
          console.log('Borrador guardado automáticamente');
        }
      }
      
      // Función para cargar borrador
      function loadDraft() {
        const draft = localStorage.getItem('convocatoria_draft');
        if (draft) {
          try {
            const data = JSON.parse(draft);
            
            // Preguntar al usuario si quiere restaurar
            if (confirm('Se encontró un borrador guardado. ¿Deseas restaurarlo?')) {
              document.getElementById('nombre-anteproyecto').value = data.nombreAnteproyecto || '';
              document.getElementById('region').value = data.region || '';
              document.getElementById('fecha-cierre').value = data.fechaCierre || '';
              document.getElementById('organizacion').value = data.organizacion || '';
              document.getElementById('sitio-web').value = data.sitioWeb || '';
              document.getElementById('pais').value = data.pais || '';
              document.getElementById('descripcion').value = data.descripcion || '';
              
              console.log('Borrador restaurado');
            } else {
              localStorage.removeItem('convocatoria_draft');
            }
          } catch (error) {
            console.error('Error al cargar borrador:', error);
            localStorage.removeItem('convocatoria_draft');
          }
        }
      }
    </script>

    <script>
      // Manejo del sidebar colapsable
      document.addEventListener('DOMContentLoaded', function() {
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        
        if (!sidebarToggle || !sidebar || !sidebarOverlay) return;
        
        // Función para alternar el sidebar
        function toggleSidebar() {
          const isCollapsed = sidebar.classList.contains('collapsed');
          
          if (isCollapsed) {
            // Expandir
            sidebar.classList.remove('collapsed');
            sidebarToggle.classList.add('active');
            
            // En móvil, mostrar overlay
            if (window.innerWidth <= 768) {
              sidebarOverlay.classList.add('active');
            }
          } else {
            // Colapsar
            sidebar.classList.add('collapsed');
            sidebarToggle.classList.remove('active');
            sidebarOverlay.classList.remove('active');
          }
        }
        
        // Event listeners
        sidebarToggle.addEventListener('click', toggleSidebar);
        
        // Cerrar sidebar al hacer clic en el overlay (móvil)
        sidebarOverlay.addEventListener('click', function() {
          sidebar.classList.add('collapsed');
          sidebarToggle.classList.remove('active');
          sidebarOverlay.classList.remove('active');
        });
        
        // Manejar cambios de tamaño de ventana
        window.addEventListener('resize', function() {
          if (window.innerWidth > 768) {
            // En desktop, quitar overlay
            sidebarOverlay.classList.remove('active');
          } else if (!sidebar.classList.contains('collapsed')) {
            // En móvil, mostrar overlay si sidebar está abierto
            sidebarOverlay.classList.add('active');
          }
        });
        
        // Inicializar estado del sidebar en móvil
        if (window.innerWidth <= 768) {
          sidebar.classList.add('collapsed');
        }
      });
    </script>

      /* Indicador de borrador guardado */
      .draft-indicator {
        position: fixed;

        background-color: #30a046;
        color: white;
        padding: 8px 12px;
        border-radius: 4px;

        opacity: 0;
        transition: opacity 0.3s;
      }
      
      .draft-indicator.show {
        opacity: 1;
      }
      
      /* Media queries para responsividad */
      @media (max-width: 768px) {
        .form-row {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        
        .action-buttons {
          flex-direction: column-reverse;
        }
        
        .action-button {
          justify-content: center;
        }
        
        .main-content {
          padding: 16px;

      }
      
      @media (max-width: 480px) {
        .convocatorias-form {
          max-width: 100%;
        }
        
        .form-input {
          padding: 10px 12px;

      }
    </style>

    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
