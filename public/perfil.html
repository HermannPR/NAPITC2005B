
<!DOCTYPE html>
<html lang="es">  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil - Mawi</title>
    <meta name="description" content="Mi Perfil en Mawi" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/sidebar-styles.css" />
  </head>
  <body class="with-sidebar-toggle">
    <div class="mawi-app-container">
      <header class="mawi-header">
        <div class="logo">
          <img src="eye-icon.svg" alt="Mawi" class="eye-icon" />
          <h2>Mawi</h2>
        </div>
        
        <div class="user-menu">
          <span id="userName">EcoRanger</span>
          <div class="avatar-circle">
            <img src="avatar-placeholder.svg" alt="Usuario" />
          </div>
        </div>
      </header>

      <!-- Sidebar Container - será inyectado por sidebar.js -->
      <div id="sidebar-container"></div>

      <div class="app-content">
        <main class="main-content">
          <div class="biomo-header">
            <h1>Mi Perfil</h1>
          </div>

          <div class="perfil-form">
            <div class="form-group">
              <label for="nombre">Nombre</label>
              <input 
                type="text" 
                id="nombre"
                class="form-input" 
                placeholder="Escribe tu nombre"
              />
            </div>

            <div class="form-group">
              <label for="apellidos">Apellidos</label>
              <input 
                type="text" 
                id="apellidos"
                class="form-input" 
                placeholder="Escribe tus apellidos"
              />
            </div>
            
            <div class="form-group">
              <label for="contrasena">Contraseña</label>
              <input 
                type="password" 
                id="contrasena"
                class="form-input" 
                placeholder="Escribe una contraseña"
              />
            </div>
            
            <div class="form-group">
              <label for="org-nombre">Nombre de la organización</label>
              <input 
                type="text" 
                id="org-nombre"
                class="form-input" 
                placeholder="Escribe el nombre de tu organización"
              />
            </div>
            
            <div class="form-group">
              <label for="org-descripcion">Descripción de la organización</label>
              <textarea
                id="org-descripcion"
                class="form-input" 
                placeholder="Descripción que hace la organización"
                rows="4"
              ></textarea>
            </div>

            <div class="support-container">
              <a href="#" class="support-button">
                <img src="support-icon.svg" alt="Soporte" />
                Contacta con el soporte
              </a>
            </div>
          </div>
        </main>
      </div>    </div>

    <!-- Sidebar modular -->
    <script src="sidebar.js"></script>
    <script>
        // Inicializar sidebar modular
        initMawiSidebar('perfil');
    </script>

    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
  </body>
</html>
